# Checked-in defaults, shared by everyone. Per-machine overrides (model path,
# secrets, etc.) go in local.toml, which is gitignored.

# Which model to use when --model is not given. Set this in local.toml.
# model = "llama"

# Candidate models, selected by name with --model or the key above. Weights are
# not checked in; models/ is gitignored. A model whose GGUF ships a template
# that cannot express tool calls needs chat_template to be usable.
[models.llama]
path = "models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"

[models.hermes]
path = "models/Hermes-3-Llama-3.1-8B.Q4_K_M.gguf"
chat_template = "templates/hermes-tools.jinja"

[models.qwen]
path = "models/Qwen_Qwen3-8B-Q4_K_M.gguf"

# Smaller development candidates for an 8GB GPU. Keep the production-sized
# models above available for environments with more VRAM; choose one explicitly
# with `--model` during local development.
[models.dev-qwen3]
path = "models/Qwen3-4B-Q4_K_M.gguf"

# Qwen3.5 GGUFs require the original model's configuration, tokenizer, and
# template. mistral.rs obtains those assets from this source model identifier.
[models.dev-qwen35]
path = "models/Qwen_Qwen3.5-4B-Q4_K_M.gguf"
source_model = "Qwen/Qwen3.5-4B"

[models.dev-qwen25]
path = "models/qwen2.5-3b-instruct-q4_k_m.gguf"

[models.dev-llama32]
path = "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"

# Sampling shared by every model. A model's own `[models.<name>.sampling]`
# overrides any field. Truncation (top_p, top_k) is on: sampling a small
# model's full distribution at a normal temperature produces incoherent tails.
[sampling]
temperature = 0.7
top_p = 0.8
top_k = 20

# Runaway bounds. These stop a loop that is already wrong - hitting one is an
# error that reaches the user, not something an agent can see and react to.
[limits]
# Requests admitted to the loaded model at once. Mistral.rs batches these
# sequences internally; foreground work is admitted before deferred work.
max_concurrent_inferences = 1
# Inferences one chat turn may run before its tool loop is abandoned. A turn
# needs one inference per tool round trip plus a final reply.
max_inferences_per_chat = 8
# Inferences one player action may run across every agent it reaches,
# including recursive agent-to-agent calls.
max_inferences_total = 64
# Fixed total input plus generated-token capacity reserved in the paged KV cache
# for each admitted inference. This determines the model's fixed VRAM budget.
max_context_tokens = 16384
# Maximum generated tokens in one inference, including tool calls.
max_output_tokens = 1024
# After a completed turn, compaction is queued when its input plus output tokens
# would make the next inference reach this size. The reply is delivered first;
# the next call to that agent waits for its queued compaction. This is lazy
# history maintenance, independent of the fixed KV-cache capacity above.
compact_before_next_input_tokens = 8000
# Recent raw history is retained exactly; older history becomes a summary.
keep_tail_messages = 32

# Browser serving is deliberately configured only in local.toml: Google OAuth
# credentials are machine/deployment secrets. `cairnworld serve` fails with a
# clear message until all fields are set.
# [web]
# bind = "127.0.0.1:3000"
# google_client_id = "..."
# google_client_secret = "..."
# google_redirect_url = "http://localhost:3000/auth/google/callback"
