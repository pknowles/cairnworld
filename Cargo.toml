[package]
name = "cairnworld"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.3"
clap = { version = "4.6.4", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
# Our fork, carrying a fix for Qwen3 GGUF inference: mistral.rs omits the
# device move before the final norm that its Llama path performs, so any
# CPU/GPU layer split fails in rms-norm. Absent from upstream as of 0.9.0.
mistralrs = { path = "third_party/mistral.rs/mistralrs", features = ["cuda"] }
rand = "0.9.2"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
