[package]
name = "cairnworld"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr", "leptos/islands", "dep:anyhow", "dep:axum", "dep:blake3", "dep:clap", "dep:config", "dep:either", "dep:leptos_axum", "dep:mistralrs", "dep:openidconnect", "dep:rand", "dep:rustyline", "dep:schemars", "dep:sqlx", "dep:tokio", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:tower-sessions", "dep:tower-sessions-sqlx-store", "dep:time"]
hydrate = ["leptos/hydrate", "leptos/islands", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
blake3 = { version = "1.8.3", optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
config = { version = "0.15.25", default-features = false, features = ["toml"], optional = true }
either = { version = "1.15.0", optional = true }
# Our fork, carrying a fix for Qwen3 GGUF inference: mistral.rs omits the
# device move before the final norm that its Llama path performs, so any
# CPU/GPU layer split fails in rms-norm. Absent from upstream as of 0.9.0.
mistralrs = { path = "third_party/mistral.rs/mistralrs", features = ["cuda"], optional = true }
leptos = { version = "0.8.14", default-features = false }
leptos_axum = { version = "0.8.8", optional = true }
openidconnect = { version = "4.0.1", optional = true }
rand = { version = "0.9.2", optional = true }
rustyline = { version = "18.0.1", optional = true }
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"], optional = true }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "io-std", "sync"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
tower-sessions = { version = "0.14.0", optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"], optional = true }
tower-http = { version = "0.6.11", features = ["fs"], optional = true }
time = { version = "0.3.47", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }
web-sys = { version = "0.3.83", optional = true, features = ["Document", "Event", "HtmlFormElement", "HtmlInputElement", "Location", "MessageEvent", "Response", "WebSocket", "Window"] }

[package.metadata.leptos]
bin-features = ["ssr"]
lib-features = ["hydrate"]
site-root = "target/site"
site-pkg-dir = "pkg"
